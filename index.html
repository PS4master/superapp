    <script>
        // داده‌های اسلایدها
        const slider1Images = [
            {
                url: "IMAGES/rubika.webp",
                
            },
            {
                url: "IMAGES/sorosh.webp",
                
            },
            {
                url: "IMAGES/eita.webp",
                
            }
        ];

        const slider2Images = [
            {
                url: "IMAGES/youtube.webp",               
            },
            {
                url: "IMAGES/telegram.webp",              
            },
            {
                url: "IMAGES/insta.webp",
            }
        ];

        // تابع ایجاد اسلایدر ساده
        function createSimpleSlider(sliderId, images) {
            const slider = document.getElementById(sliderId);
            if (!slider) {
                console.error(`اسلایدر با ID ${sliderId} یافت نشد!`);
                return;
            }

            // پاک کردن محتوای قبلی
            slider.innerHTML = '';
            
            // ایجاد دایره‌های ناوبری
            const dotsContainer = document.createElement('div');
            dotsContainer.className = 'slider-dots';
            
            // ایجاد تصاویر
            images.forEach((image, index) => {
                // ایجاد عنصر تصویر
                const imgDiv = document.createElement('div');
                imgDiv.className = 'slider-image';
                imgDiv.style.backgroundImage = `url('${image.url}')`;
                
                // اضافه کردن کپشن
                const caption = document.createElement('div');
                caption.className = 'image-caption';
                caption.textContent = image.caption;
                imgDiv.appendChild(caption);
                
                slider.appendChild(imgDiv);
                
                // ایجاد دایره ناوبری
                const dot = document.createElement('div');
                dot.className = 'slider-dot';
                if (index === 0) dot.classList.add('active');
                dot.addEventListener('click', () => {
                    showSlide(index);
                });
                dotsContainer.appendChild(dot);
            });
            
            // اضافه کردن دایره‌ها به اسلایدر
            slider.appendChild(dotsContainer);
            
            let currentIndex = 0;
            const imageElements = slider.querySelectorAll('.slider-image');
            const dotElements = slider.querySelectorAll('.slider-dot');
            
            // نمایش اولین تصویر
            if (imageElements.length > 0) {
                imageElements[0].classList.add('active');
            }
            
            // تابع نمایش یک اسلاید خاص
            function showSlide(index) {
                // مخفی کردن همه تصاویر
                imageElements.forEach(img => {
                    img.classList.remove('active');
                });
                
                // غیرفعال کردن همه دایره‌ها
                dotElements.forEach(dot => {
                    dot.classList.remove('active');
                });
                
                // نمایش تصویر انتخاب شده
                imageElements[index].classList.add('active');
                dotElements[index].classList.add('active');
                currentIndex = index;
            }
            
            // تابع نمایش اسلاید بعدی
            function nextSlide() {
                const nextIndex = (currentIndex + 1) % images.length;
                showSlide(nextIndex);
            }
            
            // شروع تایمر برای تغییر اتوماتیک هر 1 ثانیه
            let slideInterval = setInterval(nextSlide, 2000);
            
            // متوقف کردن تایمر هنگام hover روی اسلایدر
            slider.addEventListener('mouseenter', () => {
                clearInterval(slideInterval);
            });
            
            // شروع مجدد تایمر هنگام خروج از اسلایدر
            slider.addEventListener('mouseleave', () => {
                clearInterval(slideInterval);
                slideInterval = setInterval(nextSlide, 2000);
            });
            
            console.log(`اسلایدر ${sliderId} با ${images.length} تصویر ایجاد شد`);
        }
        
        // وقتی صفحه لود شد، اسلایدرها را ایجاد کن
        document.addEventListener('DOMContentLoaded', function() {
            createSimpleSlider('slider1', slider1Images);
            createSimpleSlider('slider2', slider2Images);
            
            console.log('همه اسلایدرها ایجاد شدند');
        });
    </script>
